<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- アプリのアイコンの元の絵：金色のポーカーチップと、中央のスペード。色はアプリの配色（theme.ts）と同じ -->
  <defs>
    <g id="spot">
      <rect x="45" y="5.5" width="10" height="13" rx="2" />
    </g>
  </defs>
  <circle cx="50" cy="50" r="45" fill="#f2c14e" />
  <!-- 縁の模様（8か所） -->
  <g fill="#1f6b43">
    <use href="#spot" />
    <use href="#spot" transform="rotate(45 50 50)" />
    <use href="#spot" transform="rotate(90 50 50)" />
    <use href="#spot" transform="rotate(135 50 50)" />
    <use href="#spot" transform="rotate(180 50 50)" />
    <use href="#spot" transform="rotate(225 50 50)" />
    <use href="#spot" transform="rotate(270 50 50)" />
    <use href="#spot" transform="rotate(315 50 50)" />
  </g>
  <circle cx="50" cy="50" r="29" fill="#17221c" stroke="#f2c14e" stroke-width="2.5" stroke-dasharray="4 3" />
  <!-- スペード -->
  <path fill="#f2c14e" d="M50 30 C44 38 34 43 34 52 C34 58 39 62 45 59 C44 63 42 66 39 68 L61 68 C58 66 56 63 55 59 C61 62 66 58 66 52 C66 43 56 38 50 30 Z" />
</svg>
